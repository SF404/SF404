<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Enigma Matrix: building agentic systems in public">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- agent graph -->
  <g stroke="#4b5563" stroke-width="1.5" fill="none">
    <path d="M860 150 L960 90 M860 150 L960 210 M960 90 L1070 150 M960 210 L1070 150 M960 90 L960 210 M1070 150 L1130 110 M1070 150 L1130 190"/>
  </g>
  <g>
    <circle cx="860" cy="150" r="14" fill="#0b0f1a" stroke="#818cf8" stroke-width="2.5"/>
    <circle cx="960" cy="90" r="11" fill="#0b0f1a" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="960" cy="210" r="11" fill="#0b0f1a" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="1070" cy="150" r="14" fill="#0b0f1a" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="1130" cy="110" r="7" fill="#34d399"/>
    <circle cx="1130" cy="190" r="7" fill="#34d399"/>
    <circle cx="860" cy="150" r="5" fill="#818cf8"/>
    <circle cx="1070" cy="150" r="5" fill="#34d399"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b7280">
    <text x="822" y="182">plan</text>
    <text x="936" y="66">tools</text>
    <text x="936" y="242">memory</text>
    <text x="1046" y="182">eval</text>
  </g>

  <text x="64" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#9ca3af">APPLIED AI · FULL-STACK SOFTWARE</text>
  <text x="62" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#brand)">Enigma Matrix</text>
  <text x="64" y="218" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#e5e7eb">Building agentic systems in public.</text>
</svg>
