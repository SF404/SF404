<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Animated terminal: an AI agent plans, edits, tests, reviews and ships a change">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".6">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typing">
      <rect x="60" y="88" height="34" width="0">
        <animate attributeName="width" values="0;0;760;760;0" keyTimes="0;.04;.17;.95;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:19px}
      .dim{fill:#64748b}.fg{fill:#e2e8f0}.ind{fill:#818cf8}.vio{fill:#a78bfa}
      .grn{fill:#34d399}.amb{fill:#fbbf24}.cyn{fill:#22d3ee}.pnk{fill:#f472b6}
      .ttl{font-size:14px;fill:#64748b}
    </style>
  </defs>

  <!-- window -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glow)"/>
  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="15.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M0 52 H1200" stroke="#1e293b"/>
  <circle cx="30" cy="26" r="7" fill="#f87171"/>
  <circle cx="54" cy="26" r="7" fill="#fbbf24"/>
  <circle cx="78" cy="26" r="7" fill="#34d399"/>
  <text x="600" y="31" text-anchor="middle" class="ttl">agent — ~/workspace</text>

  <!-- 1: the task, typed -->
  <g clip-path="url(#typing)">
    <text x="60" y="112"><tspan class="grn">❯</tspan><tspan class="fg"> agent run </tspan><tspan class="amb">"add rate limiting to the public API"</tspan></text>
  </g>

  <!-- 2..6: agent steps -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.24;.95;1" dur="12s" repeatCount="indefinite"/>
    <text x="60" y="152"><tspan class="ind">◆ plan    </tspan><tspan class="fg">read 38 files</tspan><tspan class="dim">  ·  </tspan><tspan class="fg">4-step plan drafted</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.31;.33;.95;1" dur="12s" repeatCount="indefinite"/>
    <text x="60" y="186"><tspan class="vio">◆ act     </tspan><tspan class="fg">edited 6 files</tspan><tspan class="dim">  ·  </tspan><tspan class="grn">+214</tspan><tspan class="dim"> / </tspan><tspan class="pnk">−37</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.40;.42;.95;1" dur="12s" repeatCount="indefinite"/>
    <text x="60" y="220"><tspan class="cyn">◆ test    </tspan><tspan class="grn">58 passed</tspan><tspan class="dim">  ·  </tspan><tspan class="fg">0 failed</tspan><tspan class="dim">  ·  </tspan><tspan class="fg">coverage 94%</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.49;.51;.95;1" dur="12s" repeatCount="indefinite"/>
    <text x="60" y="254"><tspan class="amb">◆ review  </tspan><tspan class="fg">lint </tspan><tspan class="grn">✓</tspan><tspan class="fg">   types </tspan><tspan class="grn">✓</tspan><tspan class="fg">   security </tspan><tspan class="grn">✓</tspan><tspan class="fg">   evals </tspan><tspan class="grn">✓</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.60;.62;.95;1" dur="12s" repeatCount="indefinite"/>
    <text x="60" y="296"><tspan class="grn">✔ shipped </tspan><tspan class="fg">PR opened, CI green, ready to merge</tspan></text>
  </g>

  <!-- new prompt + blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.67;.95;1" dur="12s" repeatCount="indefinite"/>
    <text x="60" y="334" class="grn">❯</text>
    <rect x="84" y="318" width="11" height="21" fill="#e2e8f0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
